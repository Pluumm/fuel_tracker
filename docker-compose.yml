services:
  postgres:
    image: postgres:16
    container_name: fuel_tracker_postgres

    environment:
      POSTGRES_USER: fueltracker
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: fueltrackerdb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  postgres_data: